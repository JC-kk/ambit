name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test --scratch-path "$RUNNER_TEMP/build"

      # Optional. Without these secrets the app is ad-hoc signed, and first launch needs
      # right-click → Open. See docs/RELEASING.md for how to set them up.
      - name: Sign and notarize
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/sign_and_notarize.sh Ambit.app

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          AMBIT_SCRATCH="$RUNNER_TEMP/build" ./scripts/package.sh "$VERSION"
          echo "dmg=dist/Ambit-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Ambit-$VERSION.zip" >> "$GITHUB_OUTPUT"

      # The quarantine note goes above the changelog on purpose: for an unnotarised app it is the
      # difference between "it won't open" issues and none.
      - name: Compose release notes
        run: |
          {
            printf '## Install\n\n'
            printf '```bash\n'
            printf 'brew install --cask --no-quarantine <owner>/tap/ambit\n'
            printf '```\n\n'
            printf 'Or download the `.dmg`, drag Ambit to Applications, then run:\n\n'
            printf '```bash\n'
            printf 'xattr -dr com.apple.quarantine /Applications/Ambit.app\n'
            printf '```\n\n'
            printf 'Ambit is ad-hoc signed, not notarised, because notarisation needs a paid Apple\n'
            printf 'Developer account. That single command is the whole workaround. Verify the\n'
            printf 'download first if you like: `shasum -a 256 -c checksums.txt`.\n\n'
            printf 'Requires macOS 26.\n\n---\n\n'
            cat CHANGELOG.md
          } > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.zip }}
            dist/checksums.txt
          body_path: RELEASE_NOTES.md
          draft: true
