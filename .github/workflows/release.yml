name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test --scratch-path "$RUNNER_TEMP/build"

      # No `if:` guard here on purpose. The `secrets` context is not available in a step-level
      # condition — using it there makes GitHub reject the whole workflow before any job starts —
      # and the script already exits successfully when no certificate is configured, leaving the
      # ad-hoc signature in place. See docs/RELEASING.md.
      - name: Sign and notarize if a certificate is configured
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/sign_and_notarize.sh Skillswitch.app

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          SKILLSWITCH_SCRATCH="$RUNNER_TEMP/build" ./scripts/package.sh "$VERSION"
          echo "dmg=dist/Skillswitch-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Skillswitch-$VERSION.zip" >> "$GITHUB_OUTPUT"

      # The quarantine note goes above the changelog on purpose: for an unnotarised app it is the
      # difference between "it won't open" issues and none.
      - name: Compose release notes
        run: |
          {
            printf '## Install\n\n'
            printf '```bash\n'
            printf 'brew install --cask JC-kk/tap/skillswitch\n'
            printf '```\n\n'
            printf 'Or download the `.dmg`, drag Skillswitch to Applications, then run:\n\n'
            printf '```bash\n'
            printf 'xattr -dr com.apple.quarantine /Applications/Skillswitch.app\n'
            printf '```\n\n'
            printf 'Skillswitch is ad-hoc signed, not notarised, because notarisation needs a paid Apple\n'
            printf 'Developer account. That single command is the whole workaround. Verify the\n'
            printf 'download first if you like: `shasum -a 256 -c checksums.txt`.\n\n'
            printf 'Requires macOS 26.\n\n---\n\n'
            cat CHANGELOG.md
          } > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.zip }}
            dist/checksums.txt
          body_path: RELEASE_NOTES.md
          draft: true
